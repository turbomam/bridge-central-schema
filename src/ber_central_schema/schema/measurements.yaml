id: https://w3id.org/ber-data/bridge-central-schema/measurements
name: measurements
title: BRIDGE Measurements Module
description: >-
  Measurement, a subclass of the core Attribute that adds a unit and what the
  value is about, and five mixins that hold how, when and from where a value
  was obtained. Built from the 2026-09-30 BRIDGE Measurements hackathon. One
  Measurement holds one value of one property, keeps the source text, and
  adds structured parts (number, range, unit, statistic, qualifier,
  missing-value reason) only when the source supports them. See docs/measurements-hackathon-2026-09-30.md for
  what was raised at the hackathon and where each item went.
license: Apache-2.0
version: 0.5.0

prefixes:
  bridge_central_schema: https://w3id.org/ber-data/bridge-central-schema/
  linkml: https://w3id.org/linkml/
  bervo: https://w3id.org/bervo/
  nmdc: https://w3id.org/nmdc/
  sosa: http://www.w3.org/ns/sosa/
  METPO: https://w3id.org/metpo/
  MIXS: https://w3id.org/mixs/
  gold: "https://bioregistry.io/gold:"
  bridge_property: https://w3id.org/ber-data/bridge-property/
  example: https://example.org/
  ber_registry: https://w3id.org/ber-data/ber-data-registry/
  UO: http://purl.obolibrary.org/obo/UO_

default_prefix: bridge_central_schema
default_range: string

imports:
  - linkml:types
  - core

types:

  PartialDateTime:
    typeof: string
    uri: xsd:string
    base: str
    description: >-
      An ISO 8601 year, year-month, date, or date-time. A date-time must
      carry a UTC offset or Z; a date or coarser carries none.
    comments:
      - >-
        The pattern checks each part's range but not whether a day exists in
        its month, so 2021-02-31 passes.
    pattern: "^[0-9]{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12][0-9]|3[01])(T([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9](\\.[0-9]+)?)?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9]))?)?)?$"

classes:

  Measurement:
    class_uri: bridge_central_schema:Measurement
    is_a: Attribute
    mixins:
      - MethodDetails
      - TimeDetails
      - StatisticDetails
      - ValueQualifiers
      - SourceDetails
    description: >-
      An Attribute whose value is of a property of some thing, with the value's
      unit and what the value is about.
    comments:
      - >-
        Inherits from Attribute the property (key or attribute_cv_id) and the
        value (raw_value, numeric_value, value_cv_id, value_type). Adds unit,
        unit_cv_id, unit_basis, a range (minimum_numeric_value,
        maximum_numeric_value) and feature_of_interest. Takes how, when and
        from where the value was obtained from five mixins: MethodDetails,
        TimeDetails, StatisticDetails, ValueQualifiers and SourceDetails.
      - >-
        Use for one value of one property, as a source reports it: a number
        with a unit, a range, a summary statistic, a categorical term, or only
        the source text, or a reason no value is present. The value can be
        measured, set as a condition, interpreted or derived (value_role), so
        the class name does not mean a reading from an instrument.
      - >-
        Not an observation event: several values from one sampling or one
        reading are separate Measurements that share source_record_id and
        source_field. Not a time series: one Measurement holds one value.
      - >-
        A measurement names its property with exactly one of attribute_cv_id
        (a bridge_property: identifier) or key (free text), and carries at
        least one of raw_value, numeric_value, minimum_numeric_value,
        maximum_numeric_value, value_cv_id or missing_value_reason. Attribute's
        own rules are not inherited: linkml-validate 1.11.1 does not apply a
        parent's any_of to a subclass, so these are stated here.
    close_mappings:
      - sosa:Observation
      - nmdc:QuantityValue
      - nmdc:PropertyAssertion
    slots:
      - measurement_id
      - unit
      - unit_cv_id
      - unit_basis
      - minimum_numeric_value
      - maximum_numeric_value
      - feature_of_interest
    slot_usage:
      attribute_cv_id:
        recommended: true
        pattern: "^bridge_property:[a-z0-9_]+$"
        description: >-
          The property that was measured, as a BRIDGE property identifier
          (bridge_property:).
        comments:
          - >-
            Each bridge_property: term has an ID, a label and a definition in
            terms/bridge_property.tsv, and mappings to BERVO, MIxS and other
            vocabularies in mappings/observed_property.sssom.tsv. New terms are
            added by pull request. A term's ID does not change once merged; its
            label and definition can be edited.
        aliases:
          - observed_property
          - measurement_type
          - variable
      key:
        description: >-
          The name of the measured property as free text, for values whose
          property has no BRIDGE identifier yet. Use attribute_cv_id instead
          whenever an identifier exists.
      value_cv_id:
        description: >-
          A categorical value as a code from an ontology or controlled
          vocabulary, parsed from raw_value the way numeric_value is parsed for
          a number, such as METPO:1000615 (mesophilic).
    exactly_one_of:
      - slot_conditions:
          attribute_cv_id:
            required: true
      - slot_conditions:
          key:
            required: true
    any_of:
      - slot_conditions:
          raw_value:
            required: true
      - slot_conditions:
          numeric_value:
            required: true
      - slot_conditions:
          minimum_numeric_value:
            required: true
      - slot_conditions:
          maximum_numeric_value:
            required: true
      - slot_conditions:
          value_cv_id:
            required: true
      - slot_conditions:
          missing_value_reason:
            required: true

  MethodDetails:
    class_uri: bridge_central_schema:MethodDetails
    mixin: true
    description: Slots that say how a value was obtained.
    comments:
      - >-
        A mixin: it is never a record on its own and has no type designator.
        Measurement uses it; any other class that needs these slots can too.
      - Inherits from nothing and adds measurement_method, instrument and treatment.
    slots:
      - measurement_method
      - instrument
      - treatment

  TimeDetails:
    class_uri: bridge_central_schema:TimeDetails
    mixin: true
    description: Slots that say when a value was observed, or the period it covers.
    comments:
      - >-
        A mixin: it is never a record on its own and has no type designator.
        Inherits from nothing and adds observed_time, observed_start_time and
        observed_end_time.
      - Not for a date that is itself the value, such as a collection date; that goes in raw_value.
    slots:
      - observed_time
      - observed_start_time
      - observed_end_time

  StatisticDetails:
    class_uri: bridge_central_schema:StatisticDetails
    mixin: true
    description: Slots for a value that summarizes several readings or individuals.
    comments:
      - >-
        A mixin: it is never a record on its own and has no type designator.
        Inherits from nothing and adds statistic, standard_deviation and
        sample_size.
    slots:
      - statistic
      - standard_deviation
      - sample_size

  ValueQualifiers:
    class_uri: bridge_central_schema:ValueQualifiers
    mixin: true
    description: >-
      Slots that say something about a value: how it relates to the true
      value, how it came to be recorded, why it is missing, and any flag on
      it.
    comments:
      - >-
        A mixin: it is never a record on its own and has no type designator.
        Inherits from nothing and adds comparator, value_role,
        value_qualifier, missing_value_reason and quality_flag.
    slots:
      - comparator
      - value_role
      - value_qualifier
      - missing_value_reason
      - quality_flag

  SourceDetails:
    class_uri: bridge_central_schema:SourceDetails
    mixin: true
    description: Slots that point back to the source record a value was read from.
    comments:
      - >-
        A mixin: it is never a record on its own and has no type designator.
        Inherits from nothing and adds source_system, source_record_id and
        source_field.
      - >-
        Not a full provenance record: it names the source and the record, not
        the ingest run or the source's version.
    slots:
      - source_system
      - source_record_id
      - source_field

slots:

  measurement_id:
    slot_uri: bridge_central_schema:measurement_id
    range: uriorcurie
    description: >-
      An identifier for this measurement, when the source has one or BRIDGE
      mints one on ingest. Optional, because many sources (ESS-DIVE among
      them) do not identify individual measurements.
    comments:
      - >-
        Not named id: the central schema's id slot is an identifier, which
        LinkML makes required, and most measurements have no identifier.

  feature_of_interest:
    slot_uri: bridge_central_schema:feature_of_interest
    range: uriorcurie
    description: >-
      A reference to the thing whose property was measured: a sample, an
      organism, a site or plot, a stream. Only a reference: classes for
      samples belong to the Samples, Projects, and Processes Modelling
      Squad, and classes for sites, plots and other landscape
      features to the Landscape/Physical Features module proposed in the
      2026-10-07 BRIDGE DM notes.
    exact_mappings:
      - sosa:hasFeatureOfInterest

  unit:
    slot_uri: bridge_central_schema:unit
    description: >-
      The unit as a UCUM code, written in printable ASCII (for example um, not
      µm). Leave empty for values without a unit, such as pH. The source's own
      spelling stays in raw_value. UCUM is a grammar rather than a fixed list,
      so most units can be written even when no common code exists, and
      annotations in braces cover counted things ({cells}/g). When a unit
      cannot be written in UCUM, leave unit empty and keep the source's unit in
      raw_value. Many units from QUDT (used by ESS-DIVE) carry a UCUM code
      (qudt:ucumCode) that can go here.
    pattern: "^[!-~]+$"
    close_mappings:
      - nmdc:has_unit

  unit_cv_id:
    slot_uri: bridge_central_schema:unit_cv_id
    range: uriorcurie
    description: >-
      The unit as a term identifier, such as UO:0000169 (parts per million),
      for sources that give one. unit keeps the UCUM code.
    comments:
      - >-
        Added for https://github.com/ber-data/bertron-schema/issues/62, which
        records a unit as text plus a unit ontology identifier.
      - Nothing checks that unit and unit_cv_id name the same unit.

  unit_basis:
    slot_uri: bridge_central_schema:unit_basis
    description: >-
      What the unit is expressed relative to, when the unit alone does not
      say, such as dry weight. Some bases fit UCUM
      annotations (mg{C}/L); this slot is for those that do not. Free text
      until examples settle a vocabulary.

  comparator:
    slot_uri: bridge_central_schema:comparator
    range: ComparatorEnum
    description: >-
      How the true value relates to numeric_value, for values reported as
      above or below a number, such as below a detection limit. When the
      source gives the limit as a number, record it in numeric_value with a
      comparator; when it gives no number, use missing_value_reason
      below_detection_limit instead.

  statistic:
    slot_uri: bridge_central_schema:statistic
    range: StatisticEnum
    description: >-
      The summary statistic that numeric_value reports, when the source value
      summarizes several readings or individuals.

  standard_deviation:
    slot_uri: bridge_central_schema:standard_deviation
    range: double
    minimum_value: 0
    description: The standard deviation reported with a mean, in the same unit.

  sample_size:
    slot_uri: bridge_central_schema:sample_size
    range: integer
    minimum_value: 1
    description: How many readings, replicates or individuals a statistic summarizes.

  value_role:
    slot_uri: bridge_central_schema:value_role
    range: ValueRoleEnum
    description: >-
      Whether the value was measured, set as an experimental condition, or
      assigned by a person interpreting other measurements.

  value_qualifier:
    slot_uri: bridge_central_schema:value_qualifier
    range: ValueQualifierEnum
    description: >-
      A qualifier the source attaches to the value, such as an optimum
      (optimal growth at 10 MPa).

  missing_value_reason:
    slot_uri: bridge_central_schema:missing_value_reason
    range: MissingValueReasonEnum
    description: >-
      Why no usable value is present. Sources often write these as text (not
      determined) or as sentinel numbers (-9999); record the source text in
      raw_value.

  measurement_method:
    slot_uri: bridge_central_schema:measurement_method
    description: >-
      How the value was obtained: a protocol name, a method reference, or the
      source's companion method field (for example an NMDC ph_meth value).
    close_mappings:
      - sosa:usedProcedure

  treatment:
    slot_uri: bridge_central_schema:treatment
    description: >-
      The experimental treatment applied to the thing measured, such as a
      warming or nitrogen addition plot, kept apart from measurement_method
      because downstream users filter and compare on it.

  instrument:
    slot_uri: bridge_central_schema:instrument
    description: The instrument or sensor that produced the value.
    close_mappings:
      - sosa:madeBySensor

  observed_time:
    slot_uri: bridge_central_schema:observed_time
    description: >-
      When the property was observed, in ISO 8601 at whatever resolution the
      source gives: a year (2021), a year and month (2021-06), a date
      (2021-06-15), or a date-time with a UTC offset (2021-06-15T14:30:00-07:00).
      A time of day must carry an offset; a date or coarser does not.
    range: PartialDateTime
    close_mappings:
      - sosa:phenomenonTime

  observed_start_time:
    slot_uri: bridge_central_schema:observed_start_time
    description: >-
      The start of the period a value covers, for sources that report a start
      and an end instead of one time. Same format as observed_time.
    range: PartialDateTime

  observed_end_time:
    slot_uri: bridge_central_schema:observed_end_time
    description: >-
      The end of the period a value covers. Same format as observed_time.
    range: PartialDateTime

  source_system:
    slot_uri: bridge_central_schema:source_system
    description: >-
      The system the value came from. Use the BER lakehouse registry entry
      (https://github.com/doe-bridge/lakehouse-registry) for the source's schema
      when it has one, such as ber_registry:schema-jgi-gold; otherwise the
      system's name, such as BASIN-3D (USGS).

  source_record_id:
    slot_uri: bridge_central_schema:source_record_id
    description: >-
      The identifier of the source record the value came from, in the
      source's own format. The schema does not impose a format.

  source_field:
    slot_uri: bridge_central_schema:source_field
    description: >-
      The source field, column or slot the value came from, named as the
      source names it.

  quality_flag:
    slot_uri: bridge_central_schema:quality_flag
    description: >-
      A flag from the source or from BRIDGE curation, such as needs_review for
      a value that could not be parsed.

enums:

  ComparatorEnum:
    enum_uri: bridge_central_schema:ComparatorEnum
    description: How a reported number relates to the true value.
    permissible_values:
      less_than:
        description: The true value is below numeric_value.
      less_than_or_equal:
        description: The true value is at or below numeric_value.
      greater_than:
        description: The true value is above numeric_value.
      greater_than_or_equal:
        description: The true value is at or above numeric_value.
      approximately:
        description: The source gave numeric_value as an approximation.

  StatisticEnum:
    enum_uri: bridge_central_schema:StatisticEnum
    description: Summary statistics a measurement value can report.
    permissible_values:
      mean:
        description: The arithmetic mean of the readings or individuals.
      median:
        description: The median of the readings or individuals.
      minimum:
        description: The smallest of the readings or individuals.
      maximum:
        description: The largest of the readings or individuals.
      standard_deviation:
        description: >-
          numeric_value is itself a standard deviation, for sources that report
          it as its own value.
      sum:
        description: The total of the readings, such as a daily precipitation total.

  ValueRoleEnum:
    enum_uri: bridge_central_schema:ValueRoleEnum
    description: How a value came to be recorded.
    permissible_values:
      measured:
        description: >-
          The value was measured, including a summary of several measurements,
          such as a spatial or daily mean (give the summary in statistic).
      setting:
        description: >-
          The value was set as an experimental condition, for example growth at
          5 degrees Celsius for 2 hours.
      interpreted:
        description: >-
          A person assigned the value after interpreting other measurements,
          for example a strain labelled mesophilic.
      derived:
        description: >-
          The value of one property was computed from values of other
          properties, for example a projected shoot area calculated from a pixel
          count and an image scale. A mean of readings of the same property is
          measured, not derived.

  ValueQualifierEnum:
    enum_uri: bridge_central_schema:ValueQualifierEnum
    description: Qualifiers a source attaches to a value.
    permissible_values:
      optimum:
        description: The value at which a process (usually growth) is best.
      tolerated:
        description: A value or range within which a process can occur.

  MissingValueReasonEnum:
    enum_uri: bridge_central_schema:MissingValueReasonEnum
    description: Reasons a measurement has no usable value.
    permissible_values:
      not_determined:
        description: The source says the value was not determined.
      not_applicable:
        description: The property does not apply to this thing.
      not_reported:
        description: The source leaves the value empty and gives no reason.
      below_detection_limit:
        description: The value was below the method's detection limit.
      above_detection_limit:
        description: The value was above the method's upper detection limit.
      unknown:
        description: >-
          The source says the value is unknown, for example by writing
          unknown where the value would be.
      out_of_range:
        description: >-
          The source used a sentinel value meaning the reading was outside the
          instrument's range.

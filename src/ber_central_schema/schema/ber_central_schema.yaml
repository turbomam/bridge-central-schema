---
id: https://w3id.org/ber-data/bridge-central-schema
name: ber-central-schema
title: BRIDGE Central Schema
description: >-
  The central BRIDGE schema for harmonized cross-BER data access. Composes
  the shared base elements in core.yaml with domain modules (currently:
  measurements.yaml and the draft umbrella.yaml).
license: Apache-2.0
see_also:
  - https://github.com/ber-data/bridge-central-schema
  - https://github.com/ber-data/lakehouse-registry

prefixes:
  bridge_central_schema: https://w3id.org/ber-data/bridge-central-schema/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  # Also declared here: the generated Python leaves out prefixes that only an imported module
  # declares when enum meanings use them (the feature model's ContigCollectionTypeEnum and
  # ScoreTypeEnum).
  MIXS: https://w3id.org/mixs/
  edam: http://edamontology.org/
default_prefix: bridge_central_schema
default_range: string

imports:
  - linkml:types
  - core
  - measurements
  - umbrella
  - ber_feature_model
